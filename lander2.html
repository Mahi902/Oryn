<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oryn - Edit Review Export</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
        /* Set Inter as the default font and ensure smooth transitions */
        .font-inter {
            font-family: 'Inter', sans-serif;
        }
        /* Style the dropdown menu to slide down (using max-height for smooth effect) */
        .dropdown-menu {
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
        }
        .dropdown-menu.active {
            max-height: 200px; /* Sufficient height to show content */
            opacity: 1;
        }
    </style>
</head>
<body class="bg-white font-inter text-gray-900 min-h-screen">

    <script>
        // --- Navigation and Initial Load Logic ---

        // Base URLs
        const DASHBOARD_URL = 'https://mahi902.github.io/Oryn/Dashboard.html';
        const EDITOR_URL = 'https://mahi902.github.io/Oryn/document-writer.html';
        const LEGAL_URL = 'https://mahi902.github.io/Oryn/legal-documents.html';
        const INSTALL_URL = 'https://mahi902.github.io/Oryn/instapp.html';
        const MAHI902_URL = 'https://mahi902.github.io';
        
        // **URL for the iframe content**
        const IFRAME_URL = 'https://mahi902.github.io/Oryn/document-writer.html';

        // Helper function for navigation
        function navigate(url, newTab = false) {
            if (newTab) {
                window.open(url, '_blank');
            } else {
                window.location.href = url;
            }
        }

        // Function to toggle the "Try Oryn" dropdown menu
        function toggleDropdown() {
            const menu = document.getElementById('pro-dropdown-menu');
            const button = document.getElementById('pro-button');
            menu.classList.toggle('active');
            button.classList.toggle('bg-gray-100'); // Simple active state styling
        }

        // Function to handle clicks within the dropdown menu
        function handleTryPro(action) {
            if (action === 'editor') {
                navigate(EDITOR_URL);
            } else if (action === 'dashboard') {
                navigate(DASHBOARD_URL);
            }
            // Close menu after selection
            document.getElementById('pro-dropdown-menu').classList.remove('active');
            document.getElementById('pro-button').classList.remove('bg-gray-100');
        }

        // Initial Load and Redirection Logic (Crucial requirement)
        document.addEventListener('DOMContentLoaded', () => {
            const body = document.getElementById('body-content');
            
            // Check for previous "Try Oryn" click
            const hasClickedPro = localStorage.getItem('Oryn_Tried');

            if (hasClickedPro === 'true') {
                // If clicked before, redirect instantly without showing content
                window.location.replace(DASHBOARD_URL);
                return;
            }

            // If it's the first time landing:
            
            // 1. Set the flag for future visits (this counts as "Try before")
            localStorage.setItem('Oryn_Tried', 'true');

            // 2. The body is initially rendered with 'opacity-0' in CSS to enforce the white screen.
            
            // 3. After 1 second (1000ms), remove the opacity class to begin the fade-in (CSS transition is 0.5s)
            setTimeout(() => {
                body.classList.remove('opacity-0');
            }, 1000); // 1000ms delay for the white screen effect
        });
    </script>
    
    <div id="body-content" class="opacity-0 transition-opacity duration-500 min-h-screen">
        
        <header class="sticky top-0 bg-white border-b border-gray-100 z-10">
            <nav class="max-w-7xl mx-auto p-4 flex justify-between items-center">
                <a href="#" onclick="navigate(MAHI902_URL, true)" class="text-xl font-bold cursor-pointer hover:text-blue-600 transition duration-150">
                    mahi902.
                </a>

                <div class="flex items-center space-x-4 relative">
                    
                    <div class="relative">
                        <button id="pro-button" onclick="toggleDropdown()" class="flex items-center px-4 py-2 rounded-lg border border-gray-300 text-blue-600 hover:border-blue-500 hover:shadow-md transition duration-200">
                            Try Oryn
                            <span class="material-symbols-rounded text-lg ml-1 transition-transform" id="pro-arrow">
                                arrow_drop_down
                            </span>
                        </button>

                        <div id="pro-dropdown-menu" class="dropdown-menu absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-xl border border-gray-100 overflow-hidden">
                            <a href="#" onclick="handleTryPro('editor')" class="flex items-center px-4 py-2 text-gray-700 hover:bg-blue-500 hover:text-white transition duration-150">
                                <span class="material-symbols-rounded mr-2">edit_document</span>
                                Launch Editor
                            </a>
                            <a href="#" onclick="handleTryPro('dashboard')" class="flex items-center px-4 py-2 text-gray-700 hover:bg-blue-500 hover:text-white transition duration-150">
                                <span class="material-symbols-rounded mr-2">dashboard</span>
                                Open Dashboard
                            </a>
                        </div>
                    </div>

                    <a href="#" onclick="navigate(LEGAL_URL, true)" class="text-gray-700 hover:text-blue-600 transition duration-150 py-2">
                        Legal
                    </a>
                </div>
            </nav>
        </header>

        <main class="max-w-7xl mx-auto py-12 md:py-20 px-4">
            <div class="grid md:grid-cols-2 gap-12 items-center">
                
                <div>
                    <div class="flex items-center text-blue-600 mb-4">
                        <span class="material-symbols-rounded text-3xl mr-2">description</span>
                        <h1 class="text-2xl font-semibold">Oryn</h1>
                    </div>
                    
                    <h2 class="text-6xl md:text-8xl font-extrabold leading-tight mb-6">
                        Edit<br>
                        Review<br>
                        Export
                    </h2>

                    <p class="text-gray-500 text-lg max-w-md mb-10">
                        Write your dream. Prove that teamwork is dream work, with your team.
                    </p>

                    <div class="flex flex-col sm:flex-row space-y-4 sm:space-y-0 sm:space-x-4">
                        <button onclick="navigate(DASHBOARD_URL)" class="flex items-center justify-center px-8 py-4 bg-blue-600 text-white font-semibold rounded-xl shadow-lg hover:bg-blue-700 transition duration-200 transform hover:scale-[1.02] active:scale-100">
                            <span class="material-symbols-rounded mr-2">dashboard</span>
                            Dashboard
                        </button>

                        <button onclick="navigate(INSTALL_URL, true)" class="flex items-center justify-center px-8 py-4 bg-white text-gray-700 font-semibold rounded-xl border-2 border-gray-300 shadow-md hover:border-gray-500 transition duration-200 transform hover:scale-[1.02] active:scale-100">
                            <span class="material-symbols-rounded mr-2">download</span>
                            Install App
                        </button>
                    </div>
                </div>

                <div class="hidden md:block">
                    <div class="bg-gray-50 p-3 rounded-2xl shadow-2xl border border-gray-200 overflow-hidden">
                        <iframe 
                            src="https://mahi902.github.io/Oryn/document-writer.html" 
                            frameborder="0" 
                            class="w-full rounded-xl"
                            style="height: 500px;" 
                            title="Oryn Editor Preview">
                        </iframe>
                    </div>
                </div>

            </div>
        </main>
        
        <footer class="max-w-7xl mx-auto p-4 text-center text-gray-400 text-sm mt-12">
            &copy; 2025 Oryn. All rights reserved.
        </footer>
    </div>

</body>
</html>
