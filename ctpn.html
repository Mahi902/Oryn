<script>
marked.setOptions({
  gfm: true,
  breaks: false,
  headerIds: true,
  highlight(code, lang) {
    if (lang && hljs.getLanguage(lang)) {
      return hljs.highlight(code, { language: lang }).value;
    }
    return hljs.highlightAuto(code).value;
  }
});

fetch("https://mahi902.github.io/Oryn/tpn.md")
  .then(res => res.text())
  .then(md => {
    document.getElementById("md").innerHTML = marked.parse(md);
  })
  .catch(() => {
    document.getElementById("md").innerHTML = "<h2>Failed to load README.md</h2>";
  });
</script>
