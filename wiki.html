<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oryn Wiki</title>
<style>
:root{--bg:#fff;--sf:#f5f5f7;--tx:#1d1d1f;--tx2:#6e6e73;--bd:#e5e5ea;--pr:#007aff;--prs:rgba(0,122,255,.1);--code:#f2f2f5;--mark:#fff3a3}
[data-t="d"]{--bg:#000;--sf:#1c1c1e;--tx:#f5f5f7;--tx2:#98989d;--bd:#2c2c2e;--pr:#0a84ff;--prs:rgba(10,132,255,.16);--code:#1c1c1e;--mark:#6b5b00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));border-bottom:1px solid var(--bd);background:var(--bg);flex-shrink:0}
header h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap}
.ib{border:0;background:var(--sf);width:34px;height:34px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex-shrink:0}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sp{flex:1}
#ln{width:84px;border:1px solid var(--bd);background:var(--sf);border-radius:10px;padding:6px 10px;outline:0}
#ln:focus,#q:focus{border-color:var(--pr)}
#wrap{flex:1;display:flex;min-height:0;position:relative}
nav{width:300px;flex-shrink:0;border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.qb{padding:10px;display:flex;gap:6px}
#q{flex:1;min-width:0;border:1px solid var(--bd);background:var(--sf);border-radius:10px;padding:7px 10px;outline:0}
#tree{flex:1;overflow-y:auto;padding:0 8px 16px;-webkit-overflow-scrolling:touch}
.g{margin:6px 0}
.gh{display:flex;align-items:center;gap:6px;width:100%;border:0;background:none;text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);padding:8px 8px 4px;cursor:pointer}
.gh i{display:inline-block;transition:transform .15s;font-style:normal}
.g.c .gh i{transform:rotate(-90deg)}.g.c .gl{display:none}
.it{display:block;padding:6px 10px;border-radius:9px;color:var(--tx);text-decoration:none;font-size:14px;line-height:1.35;cursor:pointer}
.it:hover{background:var(--sf)}.it.on{background:var(--prs);color:var(--pr);font-weight:600}
.it small{color:var(--tx2);font-weight:600;margin-right:4px}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
#doc{max-width:860px;margin:0 auto;padding:18px 20px 60px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.chip{border:1px solid var(--bd);background:var(--sf);border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--tx2);text-decoration:none;cursor:pointer}
.chip:hover{color:var(--pr);border-color:var(--pr)}
.md h1{font-size:26px;line-height:1.25;margin:.3em 0 .6em}
.md h2{font-size:20px;margin:1.7em 0 .5em;padding-bottom:.3em;border-bottom:1px solid var(--bd)}
.md h3{font-size:16.5px;margin:1.4em 0 .4em}
.md h4{font-size:15px;margin:1.2em 0 .3em}
.md a{color:var(--pr);text-decoration:none}.md a:hover{text-decoration:underline}
.md p,.md ul,.md ol{margin:.6em 0}
.md code{background:var(--code);padding:.12em .38em;border-radius:6px;font:12.8px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-word}
.md pre{background:var(--code);padding:12px 14px;border-radius:12px;overflow-x:auto}.md pre code{background:none;padding:0;word-break:normal}
.md blockquote{margin:.8em 0;padding:.2em 14px;border-left:3px solid var(--pr);background:var(--prs);border-radius:0 10px 10px 0}
.md hr{border:0;border-top:1px solid var(--bd);margin:1.6em 0}
.md img{max-width:100%}
.tw{overflow-x:auto;margin:.8em 0;border:1px solid var(--bd);border-radius:12px}
.md table{border-collapse:collapse;width:100%;font-size:13.5px}
.md th,.md td{padding:7px 11px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
.md th{background:var(--sf);white-space:nowrap}.md tr:last-child td{border-bottom:0}
.md td{min-width:70px}
details.toc,.md details{border:1px solid var(--bd);border-radius:12px;padding:8px 12px;margin:.8em 0;background:var(--sf)}
details summary{cursor:pointer;font-weight:600}
details.toc ul{list-style:none;padding-left:0;margin:.5em 0 0}
details.toc li.l3{padding-left:16px}
details.toc a{color:var(--tx);font-size:14px}
mark{background:var(--mark);color:inherit;border-radius:3px}
.pn{display:flex;gap:10px;margin-top:36px}
.pn a{flex:1;border:1px solid var(--bd);border-radius:12px;padding:10px 14px;color:var(--tx);text-decoration:none;font-size:13.5px}
.pn a:hover{border-color:var(--pr)}.pn small{display:block;color:var(--tx2)}.pn a:last-child{text-align:right}
.st{padding:40px 20px;text-align:center;color:var(--tx2)}
.rs{border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin:8px 0;display:block;color:var(--tx);text-decoration:none}
.rs:hover{border-color:var(--pr)}.rs b{color:var(--pr)}.rs p{margin:.3em 0 0;font-size:13px;color:var(--tx2)}
#ov{display:none}
@media(max-width:820px){
 nav{position:absolute;z-index:20;top:0;bottom:0;left:0;width:min(86vw,330px);transform:translateX(-102%);transition:transform .25s;box-shadow:6px 0 24px rgba(0,0,0,.2)}
 body.nv nav{transform:none}
 body.nv #ov{display:block;position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:15}
 #doc{padding:14px 14px 50px}.md h1{font-size:22px}
}
</style>
</head>
<body>
<header>
 <button class="ib" id="mb" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
 <h1>Oryn Wiki</h1><span class="sp"></span>
 <input id="ln" inputmode="numeric" placeholder="Line #" title="Jump to the page documenting a line of sceditor.html">
</header>
<div id="wrap">
 <nav>
  <div class="qb"><input id="q" placeholder="Filter pages, Enter = search text" autocomplete="off"></div>
  <div id="tree"></div>
 </nav>
 <div id="ov"></div>
 <div id="main"><article id="doc" class="md"><div class="st">Loading…</div></article></div>
</div>
<script src="vendor/marked.min.js"></script>
<script>
(function(){
'use strict';
var RAW='https://raw.githubusercontent.com/wiki/Mahi902/Oryn/', GH='https://github.com/Mahi902/Oryn/wiki/';
var qs=new URLSearchParams(location.search), th=qs.get('t');
if(!th)th=matchMedia('(prefers-color-scheme:dark)').matches?'d':'l';
document.documentElement.dataset.t=th; document.body.dataset.t=th;
var $=function(i){return document.getElementById(i)};
var cache=new Map(), pages=[], titles={}, cur='', loadSeq=0;

function fetchMd(name){
  if(cache.has(name))return Promise.resolve(cache.get(name));
  return fetch(RAW+encodeURIComponent(name)+'.md').then(function(r){
    if(!r.ok)throw new Error(r.status===404?'Page not found: '+name:'HTTP '+r.status);
    return r.text();
  }).then(function(t){cache.set(name,t);return t});
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ---------- sidebar ---------- */
function parseSidebar(t){
  var out=[],seen={};
  t.split('\n').forEach(function(l){
    var re=/\[\[([^\]|]+)\|([^\]]+)\]\]/g,m;
    while((m=re.exec(l))){var p=m[2].trim();if(!seen[p]){seen[p]=1;out.push({page:p,title:m[1].trim()})}}
  });
  return out;
}
function buildNav(items){
  if(!items.some(function(i){return i.page==='Home'}))items.unshift({page:'Home',title:'Home'});
  items.forEach(function(i){titles[i.page]=i.title});
  pages=items.map(function(i){return i.page});
  var g={Start:[],Guides:[],Sources:[]};
  items.forEach(function(i){
    var k=i.page==='Home'?'Start':/-Source-\d+/.test(i.page)?'Sources':'Guides';
    g[k].push(i);
  });
  var h='';
  Object.keys(g).forEach(function(k){
    if(!g[k].length)return;
    h+='<div class="g'+(k==='Sources'?' c':'')+'" data-g="'+k+'"><button class="gh"><i>▾</i>'+(k==='Sources'?'Source pages ('+g[k].length+')':k)+'</button><div class="gl">';
    g[k].forEach(function(i){
      var m=/^Source (\d+):\s*(.*)$/.exec(i.title);
      h+='<a class="it" data-p="'+esc(i.page)+'" href="#p='+encodeURIComponent(i.page)+'">'+(m?'<small>S'+m[1]+'</small>'+esc(m[2]):esc(i.title))+'</a>';
    });
    h+='</div></div>';
  });
  $('tree').innerHTML=h;
}
$('tree').addEventListener('click',function(e){
  var b=e.target.closest('.gh');
  if(b){b.parentNode.classList.toggle('c');return}
  if(e.target.closest('.it'))document.body.classList.remove('nv');
});
$('mb').onclick=function(){document.body.classList.toggle('nv')};
$('ov').onclick=function(){document.body.classList.remove('nv')};
function markActive(){
  document.querySelectorAll('#tree .it').forEach(function(a){
    var on=a.dataset.p===cur;a.classList.toggle('on',on);
    if(on){var g=a.closest('.g');if(g)g.classList.remove('c');}
  });
  var a=document.querySelector('#tree .it.on');if(a)a.scrollIntoView({block:'nearest'});
}
$('q').addEventListener('input',function(){
  var v=this.value.trim().toLowerCase();
  document.querySelectorAll('#tree .it').forEach(function(a){
    a.style.display=(!v||a.textContent.toLowerCase().indexOf(v)>-1||(a.dataset.p||'').toLowerCase().indexOf(v)>-1)?'':'none';
  });
  if(v)document.querySelectorAll('#tree .g').forEach(function(g){g.classList.remove('c')});
});
$('q').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&this.value.trim().length>1){location.hash='s='+encodeURIComponent(this.value.trim());document.body.classList.remove('nv')}
});

/* ---------- markdown ---------- */
function prep(md){
  var parts=md.split(/(```[\s\S]*?```|`[^`\n]*`)/);
  for(var i=0;i<parts.length;i+=2){
    parts[i]=parts[i]
      .replace(/\[\[([^\]|\n]+)\|([^\]\n]+)\]\]/g,function(m,a,b){return'['+a+']('+b.trim()+')'})
      .replace(/\[\[([^\]\n]+)\]\]/g,function(m,a){return'['+a+']('+a.trim().replace(/ /g,'-')+')'});
  }
  return parts.join('');
}
function slug(s){return s.toLowerCase().replace(/[^\w\- ]+/g,'').trim().replace(/ /g,'-')}
function sanitize(html){
  var t=document.createElement('template');t.innerHTML=html;
  t.content.querySelectorAll('script,iframe,object,embed,style,link,meta,form').forEach(function(n){n.remove()});
  t.content.querySelectorAll('*').forEach(function(n){
    Array.prototype.slice.call(n.attributes).forEach(function(a){
      if(/^on/i.test(a.name)||(/^(href|src)$/i.test(a.name)&&/^\s*javascript:/i.test(a.value)))n.removeAttribute(a.name);
    });
  });
  return t.content;
}
function render(name,md){
  var frag=sanitize(marked.parse(prep(md),{gfm:true,breaks:false,mangle:false,headerIds:false}));
  var box=document.createElement('div');box.appendChild(frag);
  var used={},toc=[];
  box.querySelectorAll('h1,h2,h3,h4').forEach(function(h){
    var s=slug(h.textContent)||'s',n=s,k=1;while(used[n])n=s+'-'+(k++);used[n]=1;h.id=n;
    if(h.tagName==='H2'||h.tagName==='H3')toc.push({id:n,t:h.textContent,l:h.tagName==='H3'});
  });
  box.querySelectorAll('table').forEach(function(t){var w=document.createElement('div');w.className='tw';t.parentNode.insertBefore(w,t);w.appendChild(t)});
  box.querySelectorAll('a[href]').forEach(function(a){
    var h=a.getAttribute('href');
    var m=/^https?:\/\/github\.com\/Mahi902\/Oryn\/wiki\/([^#?]+)(?:#(.*))?$/i.exec(h);
    if(m){h=decodeURIComponent(m[1])+(m[2]?'#'+m[2]:'')}
    else if(/^(https?:|mailto:)/i.test(h)){a.target='_blank';a.rel='noopener noreferrer';return}
    if(h.charAt(0)==='#'){a.setAttribute('data-a',h.slice(1));a.setAttribute('href','#p='+encodeURIComponent(name)+'&a='+h.slice(1));return}
    var p=h.split('#'),pg=decodeURIComponent(p[0]).replace(/\.md$/i,'');
    a.setAttribute('href','#p='+encodeURIComponent(pg)+(p[1]?'&a='+p[1]:''));
  });
  var tocEl='';
  if(toc.length>3){
    tocEl='<details class="toc"><summary>On this page ('+toc.length+')</summary><ul>'+toc.map(function(t){
      return'<li class="'+(t.l?'l3':'')+'"><a href="#p='+encodeURIComponent(name)+'&a='+t.id+'" data-a="'+t.id+'">'+esc(t.t)+'</a></li>'}).join('')+'</ul></details>';
  }
  return{html:box.innerHTML,toc:tocEl};
}

/* ---------- views ---------- */
function setDoc(html){$('doc').innerHTML=html}
function scrollToId(id){
  var el=id&&document.getElementById(id);
  if(el)el.scrollIntoView({block:'start'});else $('main').scrollTop=0;
}
function highlight(term){
  if(!term)return;var low=term.toLowerCase(),doc=$('doc');
  var w=document.createTreeWalker(doc,NodeFilter.SHOW_TEXT),n,first=null,cnt=0;
  while((n=w.nextNode())&&cnt<300){
    if(n.parentNode.closest('mark,script,style'))continue;
    var i=n.nodeValue.toLowerCase().indexOf(low);
    if(i<0)continue;
    var r=document.createRange();r.setStart(n,i);r.setEnd(n,i+term.length);
    var mk=document.createElement('mark');try{r.surroundContents(mk);cnt++;if(!first)first=mk}catch(e){}
    w=document.createTreeWalker(doc,NodeFilter.SHOW_TEXT);
  }
  if(first)first.scrollIntoView({block:'center'});
}
function showPage(name,anchor,term){
  var seq=++loadSeq;cur=name;markActive();
  setDoc('<div class="st">Loading…</div>');
  fetchMd(name).then(function(md){
    if(seq!==loadSeq)return;
    var r=render(name,md),i=pages.indexOf(name);
    var pn='';
    if(i>-1&&/-Source-\d+/.test(name)){
      var pv=pages[i-1],nx=pages[i+1];
      pn='<div class="pn">'+(pv&&/-Source-\d+/.test(pv)?'<a href="#p='+encodeURIComponent(pv)+'"><small>← Previous</small>'+esc(titles[pv])+'</a>':'<span style="flex:1"></span>')
        +(nx&&/-Source-\d+/.test(nx)?'<a href="#p='+encodeURIComponent(nx)+'"><small>Next →</small>'+esc(titles[nx])+'</a>':'')+'</div>';
    }
    setDoc('<div class="bar"><a class="chip" href="'+GH+encodeURIComponent(name)+'" target="_blank" rel="noopener">Open on GitHub ↗</a><a class="chip" id="cpl">Copy link</a></div>'+r.toc+r.html+pn);
    document.title=(titles[name]||name)+' · Oryn Wiki';
    var c=$('cpl');if(c)c.onclick=function(){var u=location.href;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){c.textContent='Copied'},function(){c.textContent='Copy failed'});setTimeout(function(){c.textContent='Copy link'},1400)};
    if(term)highlight(term);else scrollToId(anchor);
  }).catch(function(e){
    if(seq!==loadSeq)return;
    setDoc('<div class="st"><p><b>Couldn’t load this page.</b></p><p>'+esc(e.message)+'</p><p><button class="chip" id="rt">Retry</button> <a class="chip" href="'+GH+encodeURIComponent(name)+'" target="_blank" rel="noopener">Open on GitHub ↗</a></p></div>');
    $('rt').onclick=function(){showPage(name,anchor,term)};
  });
}
function snippet(t,low,len){
  var i=t.toLowerCase().indexOf(low);if(i<0)return'';
  var a=Math.max(0,i-60),s=t.slice(a,i+len+90).replace(/[`*_#|>\n]+/g,' ').replace(/\s+/g,' ');
  return(a?'…':'')+esc(s)+'…';
}
function searchAll(term){
  var seq=++loadSeq;cur='';markActive();
  var low=term.toLowerCase(),done=0,res=[],q=pages.slice(),total=q.length;
  setDoc('<h1>Search: '+esc(term)+'</h1><div class="st" id="sp">Searching 0/'+total+'…</div>');
  function worker(){
    var p=q.shift();if(!p)return Promise.resolve();
    return fetchMd(p).then(function(t){
      var L=t.toLowerCase(),n=0,i=-1;while((i=L.indexOf(low,i+1))>-1&&n<999)n++;
      var tm=(titles[p]||'').toLowerCase().indexOf(low)>-1;
      if(n||tm)res.push({p:p,n:n,tm:tm,s:snippet(t,low,term.length)});
    }).catch(function(){}).then(function(){
      done++;if(seq===loadSeq){var s=$('sp');if(s)s.textContent='Searching '+done+'/'+total+'…'}
      return worker();
    });
  }
  Promise.all([worker(),worker(),worker(),worker(),worker(),worker()]).then(function(){
    if(seq!==loadSeq)return;
    res.sort(function(a,b){return(b.tm-a.tm)||(b.n-a.n)});
    setDoc('<h1>Search: '+esc(term)+'</h1><p style="color:var(--tx2)">'+res.length+' page'+(res.length===1?'':'s')+' · '+res.reduce(function(a,r){return a+r.n},0)+' matches</p>'
      +res.slice(0,60).map(function(r){return'<a class="rs" href="#p='+encodeURIComponent(r.p)+'&h='+encodeURIComponent(term)+'"><b>'+esc(titles[r.p]||r.p)+'</b> <span style="color:var(--tx2);font-size:12px">'+r.n+' match'+(r.n===1?'':'es')+'</span>'+(r.s?'<p>'+r.s+'</p>':'')+'</a>'}).join('')
      +(res.length?'':'<div class="st">No results.</div>'));
    $('main').scrollTop=0;
  });
}
/* ---------- line jump ---------- */
function jumpLine(n){
  fetchMd('Sugarcane-Editor-Source-Map').then(function(t){
    var re=/^\| S(\d+) \| (\d+)-(\d+) \| \[S\d+\]\(([^)]+)\)/gm,m,best=null,rows=[];
    while((m=re.exec(t)))rows.push({n:+m[1],a:+m[2],b:+m[3],p:m[4]});
    for(var i=0;i<rows.length;i++){if(n>=rows[i].a&&n<=rows[i].b){best=rows[i];break}}
    if(!best)for(i=0;i<rows.length-1;i++){if(n>rows[i].b&&n<rows[i+1].a){best=rows[i];break}}
    if(best){location.hash='p='+encodeURIComponent(best.p)}
    else if(n<9072){location.hash='p=Sugarcane-Editor-Source-Map&a=line-finder-sceditorhtml-line---where-it-is-documented'}
    else{setDoc('<div class="st">Line '+n+' is outside the documented range (up to '+rows[rows.length-1].b+').</div>')}
  }).catch(function(e){setDoc('<div class="st">'+esc(e.message)+'</div>')});
}
$('ln').addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;var n=parseInt(this.value,10);
  if(n>0){jumpLine(n);document.body.classList.remove('nv')}
});

/* ---------- router ---------- */
function route(){
  var h=new URLSearchParams(location.hash.slice(1));
  if(h.get('s'))return searchAll(h.get('s'));
  var p=h.get('p')||'Home';
  if(p===cur&&!h.get('h')){var a=h.get('a');if(a){scrollToId(a)}return}
  showPage(p,h.get('a'),h.get('h'));
}
window.addEventListener('hashchange',route);
$('doc').addEventListener('click',function(e){
  var a=e.target.closest('a[data-a]');
  if(a){e.preventDefault();var id=a.getAttribute('data-a');var el=document.getElementById(id);if(el)el.scrollIntoView({block:'start'})}
});
/* ---------- start ---------- */
fetchMd('_Sidebar').then(function(t){buildNav(parseSidebar(t))}).catch(function(){buildNav([{page:'Home',title:'Home'}])}).then(route);
})();
</script>
</body>
</html>
